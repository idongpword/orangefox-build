name: OrangeFox Automated Recovery Build Pipeline

on:
  workflow_dispatch:

jobs:
  compile_recovery:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Workspace Configs
      uses: actions/checkout@v4

    - name: Run Dedicated Recovery Builder
      uses: Sushrut1101/AOSP-Recovery-Builder@v1
      with:
        MANIFEST_URL: 'https://github.com'
        MANIFEST_BRANCH: '12.1'
        DEVICE_TREE_URL: 'https://github.com'
        DEVICE_TREE_BRANCH: 'fox_12.1'
        DEVICE_NAME: 'wp19pro'
        DEVICE_PATH: 'device/oukitel/wp19pro'
        BUILD_TARGET: 'vendorboot' # Explicitly tells the builder to output a modern vendor_boot partition image
        
    - name: Inject Physical Display Specifications
      run: |
        # Hardcoding your exact device metrics cleanly before compiling
        TARGET_CONFIG="/home/runner/work/orangefox-build/orangefox-build/workspace/device/oukitel/wp19pro/BoardConfig.mk"
        if [ -f "$TARGET_CONFIG" ]; then
          sed -i '/TW_THEME/d' "$TARGET_CONFIG"
          {
            echo "TW_THEME := portrait_hdpi"
            echo "TARGET_SCREEN_WIDTH := 1080"
            echo "TARGET_SCREEN_HEIGHT := 2460"
            echo "TW_DEVICE_VERSION := Oukitel_WP19_Pro_FOX"
          } >> "$TARGET_CONFIG"
        fi

    - name: Export Final Flashable Artifact Image
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-WP19Pro-VendorBoot
        path: /home/runner/work/orangefox-build/orangefox-build/workspace/out/target/product/wp19pro/vendor_boot.img
