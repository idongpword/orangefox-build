name: OrangeFox Automatic Cloud Extractor & Compiler

on:
  workflow_dispatch:

env:
  MANIFEST_URL: "https://gitlab.com"
  MANIFEST_BRANCH: "12.1"
  DEVICE_NAME: "wp19pro"
  DEVICE_PATH: "device/oukitel/wp19pro"
  DEVICE_REPO: "https://github.com"
  DEVICE_BRANCH: "main"

jobs:
  build_recovery:
    runs-on: ubuntu-22.04
    steps:
    - name: Free Virtual Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Prepare Compilation Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget python3-pip

    - name: Pull Core Google Drive Assets
      run: |
        mkdir -p ~/cloud_assets && cd ~/cloud_assets
        
        # Safe Python script to extract the Google Drive download confirmation tokens
        cat << 'EOF' > get_gdrive.py
        import sys, requests, re
        def download_file(file_id, output):
            URL = "https://google.com"
            session = requests.Session()
            response = session.get(URL, params={'id': file_id}, stream=True)
            token = None
            for key, value in response.cookies.items():
                if 'download_warning' in key:
                    token = value
                    break
            if token:
                response = session.get(URL, params={'id': file_id, 'confirm': token}, stream=True)
            with open(output, 'wb') as f:
                for chunk in response.iter_content(chunk_size=32768):
                    if chunk: f.write(chunk)
        if __name__ == "__main__":
            download_file(sys.argv[1], sys.argv[2])
        EOF

        # Run the safe Python downloader for each asset file ID
        python3 get_gdrive.py "1ftWiBPzNWa_5t_4wJ4H1Ym1yY1P3vVJl" "boot.img"
        python3 get_gdrive.py "1djKC_mh-shcOT2BNAD_fC97xcFGCecDx" "vendor_boot.img"
        python3 get_gdrive.py "103B4EXdrz5KQr4uRx0RDfQwmG-G9kObW" "magiskboot"
        
        chmod +x magiskboot

    - name: Execute Cloud Magiskboot Extraction
      run: |
        cd ~/cloud_assets
        ./magiskboot unpack vendor_boot.img
        mkdir -p ~/extracted_kernel/
        cp kernel ~/extracted_kernel/kernel

    - name: Install Repo Workspace
      run: |
        mkdir ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync OrangeFox Core Source Code
      run: |
        mkdir ~/fox_src && cd ~/fox_src
        git config --global user.name "CloudBuilder"
        git config --global user.email "cloud@fox.local"
        repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}
        repo sync -j$(nproc --all) --force-sync

    - name: Inject Device Tree & Extracted Kernel
      run: |
        git clone -b ${{ env.DEVICE_BRANCH }} ${{ env.DEVICE_REPO }} ~/fox_src/${{ env.DEVICE_PATH }}
        cp ~/cloud_assets/kernel ~/fox_src/${{ env.DEVICE_PATH }}/prebuilt/kernel

    - name: Execute OrangeFox Compilation
      run: |
        cd ~/fox_src
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_REPLACE_TOOLBOX=1
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        
        lunch fox_${{ env.DEVICE_NAME }}-eng || lunch omni_${{ env.DEVICE_NAME }}-eng
        make vendorbootimage -j$(nproc --all)

    - name: Export Working Bootable Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Oukitel-WP19Pro
        path: ~/fox_src/out/target/product/wp19pro/vendor_boot.img
