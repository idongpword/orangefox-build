name: OrangeFox Automatic Cloud Extractor & Compiler

on:
  workflow_dispatch:

env:
  MANIFEST_URL: "https://github.com"
  MANIFEST_BRANCH: "12.1"
  DEVICE_NAME: "wp19pro"
  DEVICE_PATH: "device/oukitel/wp19pro"
  DEVICE_REPO: "https://github.com"
  DEVICE_BRANCH: "fox_12.1"

jobs:
  build_recovery:
    runs-on: ubuntu-22.04
    steps:
    - name: Free Virtual Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Prepare Compilation Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget

    - name: Pull Core Partition Blocks
      run: |
        mkdir -p ~/cloud_assets && cd ~/cloud_assets
        curl -L "https://workers.dev" -o boot.img
        curl -L "https://workers.dev" -o vendor_boot.img

    - name: Native Python Image Extraction
      run: |
        cd ~/cloud_assets
        
        # Native script parsing binary offsets for kernel size (offset 12) and dtb size (offset 40)
        python3 -c '
        import struct
        with open("boot.img", "rb") as f:
            header = f.read(4096)
            kernel_size = struct.unpack("<I", header[12:16])[0]
            dtb_size = struct.unpack("<I", header[40:44])[0]
            print(f"Extraction Pipeline Metrics -> Kernel: {kernel_size} bytes | DTB: {dtb_size} bytes")
            
            # Extract Kernel
            f.seek(4096)
            kernel_data = f.read(kernel_size)
            
            # Calculate alignment and extract DTB block cleanly
            kernel_align = ((kernel_size + 4096 - 1) // 4096) * 4096
            f.seek(4096 + kernel_align)
            dtb_data = f.read(dtb_size)
            
        with open("kernel", "wb") as k_out: k_out.write(kernel_data)
        with open("dtb", "wb") as d_out: d_out.write(dtb_data)
        '
        mkdir -p ~/extracted_assets/
        cp kernel ~/extracted_assets/kernel
        cp dtb ~/extracted_assets/dtb

    - name: Sync OrangeFox Core Source Code
      run: |
        mkdir -p ~/bin
        curl -sL "https://googleapis.com" > ~/bin/repo
        chmod a+x ~/bin/repo
        
        mkdir ~/fox_src && cd ~/fox_src
        git config --global user.name "CloudBuilder"
        git config --global user.email "cloud@fox.local"
        
        ~/bin/repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}
        ~/bin/repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Inject Device Tree & Extracted Prebuilts
      run: |
        git clone -b ${{ env.DEVICE_BRANCH }} ${{ env.DEVICE_REPO }} ~/fox_src/${{ env.DEVICE_PATH }}
        # Automatically copies BOTH the kernel and extracted dtb file directly into the prebuilt workspace folder
        cp ~/cloud_assets/kernel ~/fox_src/${{ env.DEVICE_PATH }}/prebuilt/kernel
        cp ~/cloud_assets/dtb ~/fox_src/${{ env.DEVICE_PATH }}/prebuilt/dtb

    - name: Adjust Hardware Panel Configurations
      run: |
        TARGET_CONFIG="$HOME/fox_src/${{ env.DEVICE_PATH }}/BoardConfig.mk"
        echo "Updating hardware resolution configurations inside $TARGET_CONFIG..."
        sed -i '/TW_THEME/d' "$TARGET_CONFIG"
        {
          echo "TW_THEME := portrait_hdpi"
          echo "TARGET_SCREEN_WIDTH := 1080"
          echo "TARGET_SCREEN_HEIGHT := 2460"
          echo "TW_DEVICE_VERSION := Oukitel_WP19_Pro_FOX"
        } >> "$TARGET_CONFIG"

    - name: Execute OrangeFox Compilation
      run: |
        cd ~/fox_src
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_REPLACE_TOOLBOX=1
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        
        lunch fox_${{ env.DEVICE_NAME }}-eng || lunch omni_${{ env.DEVICE_NAME }}-eng
        make vendorbootimage -j$(nproc --all)

    - name: Export Working Bootable Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Oukitel-WP19Pro
        path: ~/fox_src/out/target/product/wp19pro/vendor_boot.img
