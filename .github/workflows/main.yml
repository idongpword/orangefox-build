name: OrangeFox Automated Recovery Build Pipeline

on:
  workflow_dispatch:

jobs:
  build_recovery:
    runs-on: ubuntu-22.04
    steps:
    - name: Free Virtual Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Prepare Compilation Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget

    - name: Pull Core Partition Blocks
      run: |
        mkdir -p ~/cloud_assets && cd ~/cloud_assets
        curl -L "https://workers.dev" -o boot.img
        curl -L "https://workers.dev" -o vendor_boot.img

    - name: Native Python Kernel Extraction
      run: |
        cd ~/cloud_assets
        python3 -c '
        import struct
        with open("boot.img", "rb") as f:
            header = f.read(4096)
            kernel_size = struct.unpack("<I", header[12:16])[0]
            print(f"Detected Kernel Size: {kernel_size} bytes")
            f.seek(4096)
            kernel_data = f.read(kernel_size)
        with open("kernel", "wb") as out:
            out.write(kernel_data)
        '
        mkdir -p ~/extracted_kernel/
        cp kernel ~/extracted_kernel/kernel

    - name: Setup Latest Writable Repo Launcher
      run: |
        mkdir -p ~/bin
        # Downloads the absolute official standalone script directly into home workspace
        curl -sL "https://googleapis.com" > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Sync OrangeFox Core Source Code
      run: |
        export PATH=~/bin:$PATH
        mkdir -p ~/fox_src && cd ~/fox_src
        git config --global user.name "CloudBuilder"
        git config --global user.email "cloud@fox.local"
        
        # Hardcoded URL directly to the official GitHub mirror repository to bypass 403 blocks
        ~/bin/repo init --depth=1 -u https://github.com -b 12.1
        ~/bin/repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Inject Device Tree & Extracted Kernel
      run: |
        # Pulling your specific oukitel tree repository branch setup directly
        git clone -b fox_12.1 https://github.com ~/fox_src/device/oukitel/wp19pro
        cp ~/cloud_assets/kernel ~/fox_src/device/oukitel/wp19pro/prebuilt/kernel

    - name: Hardcode Physical Screen and Storage Parameters
      run: |
        # Hardcoding your hardware constraints straight to the configuration file path
        TARGET_CONFIG="$HOME/fox_src/device/oukitel/wp19pro/BoardConfig.mk"
        echo "Injecting hardware specs into $TARGET_CONFIG..."
        sed -i '/TW_THEME/d' "$TARGET_CONFIG"
        {
          echo "TW_THEME := portrait_hdpi"
          echo "TARGET_SCREEN_WIDTH := 1080"
          echo "TARGET_SCREEN_HEIGHT := 2460"
          echo "TW_DEVICE_VERSION := Oukitel_WP19_Pro_FOX"
        } >> "$TARGET_CONFIG"

    - name: Execute OrangeFox Compilation
      run: |
        cd ~/fox_src
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_REPLACE_TOOLBOX=1
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        
        lunch fox_wp19pro-eng || lunch omni_wp19pro-eng
        make vendorbootimage -j$(nproc --all)

    - name: Export Working Bootable Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Oukitel-WP19Pro
        path: /home/runner/fox_src/out/target/product/wp19pro/vendor_boot.img
