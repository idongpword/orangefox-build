name: Mirror Google Drive Files to GitHub Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload_assets:
    runs-on: ubuntu-latest
    steps:
    - name: Initialize Workspace
      uses: actions/checkout@v4

    - name: Download Raw Partition Images
      run: |
        mkdir -p ./downloads
        
        # Hardcoded direct binary stream downloads bypassing confirmation walls entirely
        curl -L "https://google.com" -o ./downloads/vendor_boot.img
        curl -L "https://google.com" -o ./downloads/boot.img

    - name: Publish Stable Release Asset Gateway
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0-firmware"
        name: "Oukitel WP19 Pro Native Binary Stream Layout"
        body: "Permanent mirror storage for untampered partition files completely free from cloud throttling and verification blocks."
        draft: false
        prerelease: false
        files: |
          ./downloads/vendor_boot.img
          ./downloads/boot.img
