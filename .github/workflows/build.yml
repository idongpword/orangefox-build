name: Download Images and Create GitHub Release

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  release-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdown
        run: pip install gdown

      - name: Download Boot Image from Google Drive
        run: |
          gdown --id 1ftWiBPzNWa_5t_4wJ4H1Ym1yY1P3vVJl -O boot.img

      - name: Download Vendor Boot Image from Google Drive
        run: |
          gdown --id 1djKC_mh-shcOT2BNAD_fC97xcFGCecDx -O stock_vendor_boot.img

      - name: Verify Downloaded Files
        run: |
          ls -lh boot.img stock_vendor_boot.img
          *Verification:* Both files appear in the directory with non-zero file sizes.

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: device-images-v1.0
          name: "Oukitel WP19 Pro - Boot & Vendor Boot"
          body: |
            Automatic release containing stock boot and vendor_boot images for Oukitel WP19 Pro device tree generation.
          files: |
            boot.img
            stock_vendor_boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
