name: Download Images and Create GitHub Release

on:
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  release-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to create GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install latest gdown
        run: pip install --upgrade gdown

      - name: Download Boot Image from Google Drive
        run: |
          gdown "https://drive.google.com/file/d/1ftWiBPzNWa_5t_4wJ4H1Ym1yY1P3vVJl/view?usp=drivesdk" --fuzzy -O boot.img

      - name: Download Vendor Boot Image from Google Drive
        run: |
          gdown "https://drive.google.com/file/d/1djKC_mh-shcOT2BNAD_fC97xcFGCecDx/view?usp=drivesdk" --fuzzy -O stock_vendor_boot.img

      - name: Verify Downloaded Files
        run: |
          ls -lh boot.img stock_vendor_boot.img
          test -s boot.img && test -s stock_vendor_boot.img
          *Verification:* Files exist in directory and are non-empty.

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-wp19pro-images"
          name: "Oukitel WP19 Pro Stock Boot Images"
          body: |
            Stock boot and vendor_boot images for Oukitel WP19 Pro device tree generation.
          files: |
            boot.img
            stock_vendor_boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
