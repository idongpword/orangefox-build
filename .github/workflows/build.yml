name: Download Images and Create GitHub Release

on:
  workflow_dispatch:

jobs:
  release-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Boot Image
        run: |
          curl -L -C - -o "boot.img" "https://drive.usercontent.google.com/download?id=1ftWiBPzNWa_5t_4wJ4H1Ym1yY1P3vVJl&export=download&confirm=t"

      - name: Download Vendor Boot Image
        run: |
          curl -L -C - -o "stock_vendor_boot.img" "https://drive.usercontent.google.com/download?id=1djKC_mh-shcOT2BNAD_fC97xcFGCecDx&export=download&confirm=t"

      - name: Verify Downloaded Files
        run: |
          ls -lh boot.img stock_vendor_boot.img
          test -s boot.img
          test -s stock_vendor_boot.img

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-wp19pro-images"
          name: "Oukitel WP19 Pro Stock Images"
          body: |
            Stock boot.img and stock_vendor_boot.img for Oukitel WP19 Pro device tree generation.
          files: |
            boot.img
            stock_vendor_boot.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
